plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.16'
}

repositories {
    mavenCentral()

    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }

    maven {
        name = 'OpenCollab'
        url = 'https://repo.opencollab.dev/maven-releases/'
    }

    maven {
        name = 'OpenCollabSnapshots'
        url = 'https://repo.opencollab.dev/maven-snapshots/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.159.0+26.2"

    compileOnly "org.geysermc.geyser:api:2.11.3-SNAPSHOT"
}

version = '1.0.0'
group = 'com.structurebarrels'

base {
    archivesName = 'structurebarrels'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}